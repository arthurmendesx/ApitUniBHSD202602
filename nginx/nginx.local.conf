# Nginx como proxy reverso na frente da API FastAPI/Uvicorn

# Rate limiting: 10 req/s por IP, com zona de 10 MB para guardar os IPs
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_status 429;

upstream api_backend {
    # Uvicorn rodando localmente (sem Docker)
    server 127.0.0.1:8000;
    # Para balancear carga, basta adicionar mais instâncias:
    # server api2:8000;
}

server {
    listen 8080;
    server_name _;

    server_tokens off;            # esconde a versão do Nginx
    client_max_body_size 1m;      # limita o tamanho do corpo da requisição

    # Cabeçalhos de segurança
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://api_backend;
        proxy_http_version 1.1;

        # Repassa ao Uvicorn os dados reais do cliente
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Healthcheck do próprio Nginx
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
