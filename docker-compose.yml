services:
  api:
    build: .
    expose:
      - "8000"          # visível só na rede interna, NÃO publicado no host
    volumes:
      - dados:/app/data
    environment:
      - DB_PATH=/app/data/banco_a3.db
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"       # único ponto de entrada externo
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dados:
